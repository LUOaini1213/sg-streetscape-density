name: ci
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - name: lint (pyflakes)
        run: python -m pyflakes ssd scripts tests
      - name: unit tests (CPU, small fixtures)
        run: python -m pytest -q tests
      - name: README / paper numbers recomputed from committed outputs
        run: python -m scripts.check_numbers
      - name: mutation check (every planted bug must be caught)
        run: python -m scripts.mutation_check
